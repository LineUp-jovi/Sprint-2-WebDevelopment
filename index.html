<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Simples</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Ligando o CSS -->
  <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>

  <div class="login-box">
    <h2>Login</h2>

    <input type="text" id="usuario" placeholder="Usuário">
    <div class="teste">
      <input type="password" id="senha" placeholder="Senha">

      <!-- Botão para poder ver a senha -->
      <button class="btn-verSenha" onclick="mostrarSenha()"><i class="fa-regular fa-eye"></i></button>
    </div>
    <div class="link">
      <!-- Botão linkado com a função do JavaScript -->
      <button class="btn-enviar" onclick="fazerLogin()">Enviar</button>

      <a href=""> Create acount</a>
    </div>
    
  </div>

  <!-- Ligando o JavaScript -->
  <script src="./script.js"></script>

</body>
</html>
